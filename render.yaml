services:
  - type: web
    name: vedantu-mt-ai-interview
    runtime: node
    # Free instances cannot attach a disk at all — Starter is the minimum
    # paid tier that supports one. This is what makes PERSISTENT_DATA_DIR
    # below actually work instead of just suppressing the startup warning.
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: interview-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Sarvam AI voice (Saarika STT + Bulbul TTS). Optional — leave unset to
      # fall back to browser Web Speech voices.
      - key: SARVAM_API_KEY
        sync: false
      # Must exactly match disk.mountPath above — store.js and server.js's
      # RECORDINGS_DIR both read this to decide where reports/recordings live.
      # Without it, both fall back to the app's own directory, which Render
      # wipes on every redeploy AND on free-tier idle spin-down.
      - key: PERSISTENT_DATA_DIR
        value: /var/data

# Editing this file alone does NOT change an already-running Render service —
# it only takes effect via Render's Blueprint sync (or a fresh deploy from
# this Blueprint). If this service was created by clicking around the
# dashboard rather than from render.yaml, make the equivalent changes there
# instead: Settings -> Instance Type -> Starter, then Disks -> Add Disk, then
# Environment -> add PERSISTENT_DATA_DIR matching the mount path.
#
# Disk cost: $7/mo minimum (Starter instance) + $0.25/GB-month for the disk
# itself. Reports are tiny (~15KB each) so their share is negligible; video
# recordings (~150MB/interview) are what actually grows this over time —
# resize sizeGB upward later if needed (grows live, no downtime; cannot
# shrink). See the admin cost notes from the persistence discussion for the
# cheaper-long-term alternative (hosted DB + object storage) if this disk
# cost becomes worth avoiding at higher volume.
