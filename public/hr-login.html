<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Dashboard Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 400px;
    }
    .login-card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo-icon {
      font-size: 48px;
      margin-bottom: 15px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 10px;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
      font-family: inherit;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 20px;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }
    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    .error {
      background: #fee2e2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }
    .success {
      background: #dcfce7;
      border: 1px solid #bbf7d0;
      color: #166534;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }
    .loader {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 15px;
      font-size: 14px;
    }
    .remember-me input {
      width: auto;
    }
    .info-box {
      background: #f0f9ff;
      border-left: 4px solid #0284c7;
      padding: 12px 16px;
      border-radius: 4px;
      font-size: 13px;
      color: #0c4a6e;
      margin-top: 20px;
    }
    .password-hint {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 8px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="login-card">
      <div class="logo">
        <div class="logo-icon">📹</div>
        <h1>HR Dashboard</h1>
        <div class="subtitle">Live Interview Monitoring</div>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="error" id="errorMsg"></div>
        <div class="success" id="successMsg"></div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
            autocomplete="off"
          >
          <div class="password-hint">Contact your administrator if you forgot the password</div>
        </div>

        <div class="remember-me">
          <input type="checkbox" id="rememberMe" name="rememberMe">
          <label for="rememberMe" style="margin: 0;">Remember me for 8 hours</label>
        </div>

        <button type="submit" class="btn" id="submitBtn">
          <span id="btnText">Login to Dashboard</span>
        </button>
      </form>

      <div class="info-box">
        💡 <strong>Tip:</strong> You'll see all live interviews once logged in. You can watch multiple interviews simultaneously!
      </div>
    </div>
  </div>

  <script>
    const passwordInput = document.getElementById('password');
    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const rememberMe = document.getElementById('rememberMe');

    // Where to go once logged in. The live-watch page sends HR here with
    // ?next=/hr-watch/<id> when their session has expired; only same-origin
    // paths are honoured.
    const nextParam = new URLSearchParams(window.location.search).get('next') || '';
    const nextUrl = /^\/(?!\/)/.test(nextParam) ? nextParam : '/hr-dashboard';

    // Check if already logged in
    async function checkSession() {
      try {
        const res = await fetch('/api/hr/session');
        const data = await res.json();
        if (data.isHR) {
          window.location.href = nextUrl;
        }
      } catch (e) {
        console.log('Session check failed (non-fatal)');
      }
    }

    // Focus on password field on load
    window.addEventListener('load', () => {
      checkSession();
      passwordInput.focus();
    });

    // Allow Enter key to submit
    passwordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        loginForm.dispatchEvent(new Event('submit'));
      }
    });

    async function handleLogin(event) {
      event.preventDefault();
      showError('');
      showSuccess('');

      const password = passwordInput.value.trim();
      if (!password) {
        showError('Please enter a password');
        return;
      }

      submitBtn.disabled = true;
      btnText.innerHTML = '<span class="loader"></span>Authenticating...';

      try {
        const response = await fetch('/api/hr/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await response.json();

        if (!response.ok) {
          showError(data.error || 'Authentication failed');
          submitBtn.disabled = false;
          btnText.textContent = 'Login to Dashboard';
          passwordInput.value = '';
          passwordInput.focus();
          return;
        }

        showSuccess('✓ Login successful! Redirecting...');

        // Set session duration preference
        if (rememberMe.checked) {
          localStorage.setItem('hrRememberMe', 'true');
        } else {
          localStorage.removeItem('hrRememberMe');
        }

        // Redirect to dashboard after brief delay
        setTimeout(() => {
          window.location.href = nextUrl;
        }, 500);
      } catch (error) {
        console.error('Login error:', error);
        showError('Network error. Please check your connection and try again.');
        submitBtn.disabled = false;
        btnText.textContent = 'Login to Dashboard';
      }
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = msg ? 'block' : 'none';
    }

    function showSuccess(msg) {
      successMsg.textContent = msg;
      successMsg.style.display = msg ? 'block' : 'none';
    }
  </script>
</body>
</html>
