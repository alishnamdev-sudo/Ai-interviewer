<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Interview - HR Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 1200px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 600;
    }
    .status {
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.3);
      font-size: 14px;
      font-weight: 500;
    }
    .status.live { background: #10b981; }
    .status.connecting { background: #f59e0b; animation: pulse 1.5s infinite; }
    .status.disconnected { background: #ef4444; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .main-content {
      display: flex;
      flex: 1;
      gap: 20px;
      padding: 20px;
    }
    .video-area {
      flex: 1;
      background: #000;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      flex-direction: column;
    }
    video {
      width: 100%;
      flex: 1;
      object-fit: contain;
      background: #000;
    }
    #audioVisualizer {
      display: block;
      width: 100%;
      height: 60px;
      background: #1a1a1a;
      border-top: 1px solid #333;
    }
    .no-video {
      color: #999;
      text-align: center;
    }
    .sidebar {
      width: 300px;
      background: #f9fafb;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .info-block {
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 15px;
    }
    .info-block:last-child { border-bottom: none; }
    .info-label {
      font-size: 12px;
      color: #6b7280;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .info-value {
      font-size: 16px;
      color: #1f2937;
      font-weight: 500;
    }
    .timer {
      font-size: 32px;
      font-weight: 700;
      color: #667eea;
      font-family: 'Courier New', monospace;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-top: auto;
    }
    button {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-primary {
      background: #667eea;
      color: white;
    }
    .btn-primary:hover { background: #5568d3; }
    .btn-danger {
      background: #ef4444;
      color: white;
    }
    .btn-danger:hover { background: #dc2626; }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .error {
      padding: 15px;
      background: #fee2e2;
      border-left: 4px solid #ef4444;
      color: #7f1d1d;
      border-radius: 4px;
      margin-bottom: 15px;
    }
    .success {
      padding: 15px;
      background: #dcfce7;
      border-left: 4px solid #10b981;
      color: #166534;
      border-radius: 4px;
      margin-bottom: 15px;
    }
    @media (max-width: 768px) {
      .main-content {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
      }
      .header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📹 Live Interview Monitor</h1>
      <div class="status connecting" id="status">Connecting...</div>
    </div>

    <div class="main-content">
      <div class="video-area">
        <div style="width: 100%; height: 100%; display: flex; flex-direction: column;">
          <video id="liveVideo" playsinline controls style="flex: 1; background: #000;"></video>
          <canvas id="audioVisualizer" style="width: 100%; height: 60px; background: #1a1a1a;"></canvas>
          <div class="no-video" id="noVideoMsg" style="display: none;">
            Waiting for interview to start...
          </div>
        </div>
      </div>

      <div class="sidebar">
        <div id="errorContainer"></div>

        <div class="info-block">
          <div class="info-label">Candidate</div>
          <div class="info-value" id="candidateName">—</div>
        </div>

        <div class="info-block">
          <div class="info-label">Subject</div>
          <div class="info-value" id="subject">—</div>
        </div>

        <div class="info-block">
          <div class="info-label">Stream Time</div>
          <div class="timer" id="timer">00:00:00</div>
        </div>

        <div class="info-block">
          <div class="info-label">Stream Status</div>
          <div class="info-value" id="streamStatus" style="color: #10b981;">Connected</div>
        </div>

        <div class="controls">
          <button class="btn-primary" id="refreshBtn" onclick="location.reload()">Refresh</button>
          <button class="btn-danger" id="exitBtn" onclick="window.close()">Exit</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('liveVideo');
    const canvas = document.getElementById('audioVisualizer');
    const canvasCtx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const candidateNameEl = document.getElementById('candidateName');
    const subjectEl = document.getElementById('subject');
    const timerEl = document.getElementById('timer');
    const streamStatusEl = document.getElementById('streamStatus');
    const errorContainer = document.getElementById('errorContainer');
    const noVideoMsg = document.getElementById('noVideoMsg');

    let ws = null;
    let mediaSource = null;
    let sourceBuffer = null;
    let streamStartTime = null;
    let videoChunks = [];
    let isConnected = false;

    // Audio visualizer setup
    let audioContext = null;
    let analyser = null;
    let animationId = null;
    const BAR_COUNT = 32;
    const COLOR_BARS = '#667eea';
    const COLOR_BG = '#1a1a1a';

    // ─── Audio Visualizer ─────────────────────────────────────────────────────
    function initAudioVisualizer() {
      try {
        // Create audio context from video element
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        if (audioContext.state === 'suspended') {
          audioContext.resume();
        }

        if (!analyser) {
          const source = audioContext.createMediaElementAudioSource(video);
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 256;
          source.connect(analyser);
          analyser.connect(audioContext.destination);
        }

        // Start drawing visualizer
        if (!animationId) {
          drawVisualizer();
        }
      } catch (e) {
        console.warn('Audio visualizer not available:', e);
      }
    }

    function drawVisualizer() {
      animationId = requestAnimationFrame(drawVisualizer);

      if (!analyser || !canvasCtx) return;

      // Set canvas size
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;

      // Get frequency data
      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(dataArray);

      // Draw background
      canvasCtx.fillStyle = COLOR_BG;
      canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw bars
      const barWidth = (canvas.width / BAR_COUNT) * 0.8;
      const barGap = (canvas.width / BAR_COUNT) * 0.2;
      const maxFrequencies = Math.floor(dataArray.length / BAR_COUNT);

      for (let i = 0; i < BAR_COUNT; i++) {
        // Get average frequency for this bar
        const start = i * maxFrequencies;
        const end = start + maxFrequencies;
        let sum = 0;
        for (let j = start; j < end && j < dataArray.length; j++) {
          sum += dataArray[j];
        }
        const avg = sum / maxFrequencies;

        // Normalize to canvas height
        const barHeight = (avg / 255) * canvas.height;
        const x = i * (barWidth + barGap);
        const y = canvas.height - barHeight;

        // Draw bar with gradient
        const gradient = canvasCtx.createLinearGradient(0, y, 0, canvas.height);
        gradient.addColorStop(0, COLOR_BARS);
        gradient.addColorStop(1, '#764ba2');

        canvasCtx.fillStyle = gradient;
        canvasCtx.fillRect(x, y, barWidth, barHeight);

        // Draw top highlight
        canvasCtx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        canvasCtx.fillRect(x, y - 2, barWidth, 2);
      }
    }

    function stopVisualizer() {
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
    }

    function getStreamId() {
      const path = window.location.pathname;
      const match = path.match(/\/hr-watch\/([a-f0-9-]+)/i);
      return match ? match[1] : null;
    }

    function showError(msg) {
      const div = document.createElement('div');
      div.className = 'error';
      div.textContent = msg;
      errorContainer.innerHTML = '';
      errorContainer.appendChild(div);
    }

    function showSuccess(msg) {
      const div = document.createElement('div');
      div.className = 'success';
      div.textContent = msg;
      errorContainer.innerHTML = '';
      errorContainer.appendChild(div);
      setTimeout(() => errorContainer.innerHTML = '', 5000);
    }

    function updateStatus(text, className) {
      statusEl.textContent = text;
      statusEl.className = 'status ' + (className || '');
      streamStatusEl.textContent = text;
    }

    function startTimer() {
      if (!streamStartTime) streamStartTime = Date.now();
      setInterval(() => {
        const elapsed = Math.floor((Date.now() - streamStartTime) / 1000);
        const hours = Math.floor(elapsed / 3600);
        const minutes = Math.floor((elapsed % 3600) / 60);
        const seconds = elapsed % 60;
        timerEl.textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }, 1000);
    }

    function initMediaSource() {
      try {
        mediaSource = new MediaSource();
        video.src = URL.createObjectURL(mediaSource);
        mediaSource.addEventListener('sourceopen', () => {
          // Try webm first, then mp4
          const codecs = [
            'video/webm; codecs="vp8, vorbis"',
            'video/webm; codecs="vp9, opus"',
            'video/webm',
            'video/mp4; codecs="avc1.42E01E, mp4a.40.2"',
            'video/mp4'
          ];

          let supported = null;
          for (const codec of codecs) {
            if (MediaSource.isTypeSupported(codec)) {
              supported = codec;
              break;
            }
          }

          if (!supported) {
            console.warn('No supported codec found, using generic webm');
            supported = 'video/webm';
          }

          try {
            sourceBuffer = mediaSource.addSourceBuffer(supported);
            sourceBuffer.addEventListener('error', e => console.error('SourceBuffer error:', e));
            console.log('MediaSource initialized with:', supported);
          } catch (e) {
            showError('Could not initialize media: ' + e.message);
          }
        });
      } catch (e) {
        showError('MediaSource not supported in this browser');
        console.error(e);
      }
    }

    function connectWebSocket() {
      const streamId = getStreamId();
      if (!streamId) {
        showError('Invalid or missing stream ID');
        updateStatus('Error', 'disconnected');
        return;
      }

      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const url = `${protocol}//${window.location.host}/api/stream/watch?id=${streamId}`;

      ws = new WebSocket(url);

      ws.onopen = () => {
        console.log('WebSocket connected');
        isConnected = true;
        updateStatus('Live', 'live');
        showSuccess('Connected to interview stream');
        initMediaSource();
      };

      ws.binaryType = 'arraybuffer';

      ws.onmessage = (event) => {
        // Check if it's a text message (metadata) or binary (chunk)
        if (typeof event.data === 'string') {
          try {
            const msg = JSON.parse(event.data);
            if (msg.type === 'metadata') {
              candidateNameEl.textContent = msg.candidateName || '—';
              subjectEl.textContent = msg.subject || '—';
              startTimer();
              noVideoMsg.style.display = 'none';
              // Start audio visualizer when metadata received
              initAudioVisualizer();
            }
          } catch (e) {
            console.error('Failed to parse message:', e);
          }
        } else if (event.data instanceof ArrayBuffer) {
          // Binary chunk: read 4-byte size prefix + chunk data
          if (sourceBuffer && mediaSource && event.data.byteLength > 4) {
            try {
              const view = new Uint8Array(event.data);
              const sizeBuffer = new Uint32Array(event.data, 0, 1);
              const size = sizeBuffer[0];
              const chunk = new Uint8Array(event.data, 4);

              if (chunk.length > 0) {
                videoChunks.push(chunk);
                if (sourceBuffer.updating === false && videoChunks.length > 0) {
                  sourceBuffer.appendBuffer(videoChunks.shift());
                }
              }
            } catch (e) {
              console.error('Failed to process chunk:', e);
            }
          }
        }
      };

      ws.onerror = (error) => {
        console.error('WebSocket error:', error);
        showError('Stream connection error');
        updateStatus('Error', 'disconnected');
        stopVisualizer();
      };

      ws.onclose = () => {
        console.log('WebSocket disconnected');
        isConnected = false;
        updateStatus('Disconnected', 'disconnected');
        showError('Stream connection closed');
        stopVisualizer();
        // Try to reconnect after 3 seconds
        setTimeout(connectWebSocket, 3000);
      };
    }

    // Handle SourceBuffer update events
    if (mediaSource) {
      mediaSource.addEventListener('sourceopen', () => {
        if (sourceBuffer) {
          sourceBuffer.addEventListener('updateend', () => {
            if (videoChunks.length > 0 && sourceBuffer.updating === false) {
              sourceBuffer.appendBuffer(videoChunks.shift());
            }
          });
        }
      });
    }

    // Initialize
    connectWebSocket();
  </script>
</body>
</html>
