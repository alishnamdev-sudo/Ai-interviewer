<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Interview - HR Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 1200px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 600;
    }
    .status {
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.3);
      font-size: 14px;
      font-weight: 500;
    }
    .status.live { background: #10b981; }
    .status.connecting { background: #f59e0b; animation: pulse 1.5s infinite; }
    .status.disconnected { background: #ef4444; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .main-content {
      display: flex;
      flex: 1;
      gap: 20px;
      padding: 20px;
    }
    .video-area {
      flex: 1;
      min-height: 420px;
      background: #000;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    video {
      width: 100%;
      flex: 1;
      min-height: 0;
      object-fit: contain;
      background: #000;
    }
    #audioVisualizer {
      display: block;
      width: 100%;
      height: 60px;
      background: #1a1a1a;
      border-top: 1px solid #333;
    }
    .no-video {
      position: absolute;
      inset: 0 0 60px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      text-align: center;
      padding: 20px;
    }
    .sound-btn {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 18px;
      border: none;
      border-radius: 999px;
      background: #667eea;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      z-index: 2;
    }
    .sound-btn:hover { background: #5568d3; }
    .sidebar {
      width: 300px;
      background: #f9fafb;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .info-block {
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 15px;
    }
    .info-block:last-child { border-bottom: none; }
    .info-label {
      font-size: 12px;
      color: #6b7280;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .info-value {
      font-size: 16px;
      color: #1f2937;
      font-weight: 500;
    }
    .timer {
      font-size: 32px;
      font-weight: 700;
      color: #667eea;
      font-family: 'Courier New', monospace;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-top: auto;
    }
    button {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-primary {
      background: #667eea;
      color: white;
    }
    .btn-primary:hover { background: #5568d3; }
    .btn-danger {
      background: #ef4444;
      color: white;
    }
    .btn-danger:hover { background: #dc2626; }
    .error {
      padding: 15px;
      background: #fee2e2;
      border-left: 4px solid #ef4444;
      color: #7f1d1d;
      border-radius: 4px;
      margin-bottom: 15px;
    }
    .notice {
      padding: 15px;
      background: #dcfce7;
      border-left: 4px solid #10b981;
      color: #166534;
      border-radius: 4px;
      margin-bottom: 15px;
    }
    @media (max-width: 768px) {
      .main-content {
        flex-direction: column;
      }
      .video-area {
        min-height: 280px;
      }
      .sidebar {
        width: 100%;
      }
      .header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📹 Live Interview Monitor</h1>
      <div class="status connecting" id="status">Connecting…</div>
    </div>

    <div class="main-content">
      <div class="video-area">
        <video id="liveVideo" playsinline controls></video>
        <canvas id="audioVisualizer"></canvas>
        <div class="no-video" id="noVideoMsg">Waiting for the interview to start…</div>
        <button class="sound-btn" id="soundBtn" hidden>🔊 Click to enable sound</button>
      </div>

      <div class="sidebar">
        <div id="errorContainer"></div>

        <div class="info-block">
          <div class="info-label">Candidate</div>
          <div class="info-value" id="candidateName">—</div>
        </div>

        <div class="info-block">
          <div class="info-label">Subject</div>
          <div class="info-value" id="subject">—</div>
        </div>

        <div class="info-block">
          <div class="info-label">Interview Time</div>
          <div class="timer" id="timer">00:00:00</div>
        </div>

        <div class="info-block">
          <div class="info-label">Stream Status</div>
          <div class="info-value" id="streamStatus">Connecting…</div>
        </div>

        <div class="controls">
          <button class="btn-primary" onclick="location.reload()">Refresh</button>
          <button class="btn-danger" onclick="window.location.href = '/hr-dashboard'">Back to Dashboard</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ── How this works ──────────────────────────────────────────────────────
    // The candidate's browser records the interview with MediaRecorder and
    // appends each chunk to a file on the server as it goes. This page polls
    // /api/stream/data for the bytes appended since its last poll and feeds
    // them into a MediaSource. The file is one continuous WebM stream, so the
    // <video> plays it like any other video — picture and sound — a few
    // seconds behind real time. Plain HTTP: nothing for a proxy to block.
    const POLL_MS = 1500;
    const TARGET_LAG_S = 4;   // play this far behind the newest data (buffer against upload/poll jitter)
    const MAX_LAG_S = 20;     // fallen further behind than this (tab was hidden?) → jump forward
    const KEEP_BEHIND_S = 90; // evict already-played media older than this; long interviews would otherwise hit the SourceBuffer quota

    const video = document.getElementById('liveVideo');
    const canvas = document.getElementById('audioVisualizer');
    const canvasCtx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const candidateNameEl = document.getElementById('candidateName');
    const subjectEl = document.getElementById('subject');
    const timerEl = document.getElementById('timer');
    const streamStatusEl = document.getElementById('streamStatus');
    const errorContainer = document.getElementById('errorContainer');
    const noVideoMsg = document.getElementById('noVideoMsg');
    const soundBtn = document.getElementById('soundBtn');

    const streamId = (window.location.pathname.match(/\/hr-watch\/([a-f0-9-]+)/i) || [])[1] || null;
    // Identifies this tab to the server so the dashboard's viewer count is right.
    const viewerId = (() => {
      try {
        let v = sessionStorage.getItem('hrViewerId');
        if (!v) { v = crypto.randomUUID(); sessionStorage.setItem('hrViewerId', v); }
        return v;
      } catch (_) { return Math.random().toString(36).slice(2); }
    })();

    let offset = 0;          // bytes of the recording fetched so far
    let mediaSource = null;
    let sourceBuffer = null;
    let sourceReady = null;  // promise: SourceBuffer exists
    const pending = [];      // ArrayBuffers waiting for the SourceBuffer
    let playbackStarted = false;
    let ended = false;
    let stopped = false;
    let failures = 0;
    let streamStartTime = null;
    let timerInterval = null;

    // ── UI helpers ──────────────────────────────────────────────────────────
    function showMessage(msg, className) {
      const div = document.createElement('div');
      div.className = className;
      div.textContent = msg;
      errorContainer.innerHTML = '';
      errorContainer.appendChild(div);
    }
    const showError = msg => showMessage(msg, 'error');
    const showNotice = msg => showMessage(msg, 'notice');

    function updateStatus(text, className) {
      statusEl.textContent = text;
      statusEl.className = 'status ' + (className || '');
      streamStatusEl.textContent = text;
    }

    function toLogin() {
      window.location.href = '/hr-login?next=' + encodeURIComponent(window.location.pathname);
    }

    function startTimer(startTime) {
      streamStartTime = startTime;
      clearInterval(timerInterval);
      const tick = () => {
        const elapsed = Math.max(0, Math.floor((Date.now() - streamStartTime) / 1000));
        const h = Math.floor(elapsed / 3600), m = Math.floor((elapsed % 3600) / 60), s = elapsed % 60;
        timerEl.textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      };
      tick();
      timerInterval = setInterval(tick, 1000);
    }

    // ── Audio visualizer ────────────────────────────────────────────────────
    // Routing the <video>'s audio through an AudioContext silences it while
    // the context is suspended, and browsers keep it suspended until the
    // viewer interacts with the page — so this is only wired up from a click.
    let audioContext = null;
    let analyser = null;
    let animationId = null;
    const BAR_COUNT = 32;

    function initAudioVisualizer() {
      try {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') audioContext.resume();
        if (!analyser) {
          const source = audioContext.createMediaElementSource(video);
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 256;
          source.connect(analyser);
          analyser.connect(audioContext.destination);
        }
        if (!animationId) drawVisualizer();
      } catch (e) {
        console.warn('[HR-Watch] Audio visualizer not available:', e);
      }
    }

    function drawVisualizer() {
      animationId = requestAnimationFrame(drawVisualizer);
      if (!analyser) return;
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      const data = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(data);

      canvasCtx.fillStyle = '#1a1a1a';
      canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

      const slot = canvas.width / BAR_COUNT;
      const barWidth = slot * 0.8;
      const binsPerBar = Math.floor(data.length / BAR_COUNT);
      for (let i = 0; i < BAR_COUNT; i++) {
        let sum = 0;
        for (let j = i * binsPerBar; j < (i + 1) * binsPerBar; j++) sum += data[j];
        const barHeight = (sum / binsPerBar / 255) * canvas.height;
        const x = i * slot, y = canvas.height - barHeight;
        const gradient = canvasCtx.createLinearGradient(0, y, 0, canvas.height);
        gradient.addColorStop(0, '#667eea');
        gradient.addColorStop(1, '#764ba2');
        canvasCtx.fillStyle = gradient;
        canvasCtx.fillRect(x, y, barWidth, barHeight);
      }
    }

    function stopVisualizer() {
      if (animationId) cancelAnimationFrame(animationId);
      animationId = null;
    }

    // ── MediaSource plumbing ────────────────────────────────────────────────
    function initMediaSource(serverMime) {
      if (sourceReady) return sourceReady;
      sourceReady = new Promise((resolve, reject) => {
        if (!window.MediaSource) {
          return reject(new Error('This browser cannot play live streams (no MediaSource support). Please use Chrome or Edge.'));
        }
        const candidates = [serverMime, 'video/webm; codecs="vp9,opus"', 'video/webm; codecs="vp8,opus"', 'video/webm'].filter(Boolean);
        const type = candidates.find(t => MediaSource.isTypeSupported(t));
        if (!type) {
          return reject(new Error(`This browser cannot play the recording format (${serverMime || 'unknown'}). Please use Chrome or Edge.`));
        }
        mediaSource = new MediaSource();
        mediaSource.addEventListener('sourceopen', () => {
          try {
            sourceBuffer = mediaSource.addSourceBuffer(type);
            sourceBuffer.addEventListener('updateend', pump);
            sourceBuffer.addEventListener('error', () => {
              console.error('[HR-Watch] SourceBuffer error');
              showError('Video decode error — click Refresh to reconnect.');
            });
            console.log('[HR-Watch] MediaSource ready:', type);
            resolve();
          } catch (e) {
            reject(e);
          }
        }, { once: true });
        video.src = URL.createObjectURL(mediaSource);
      });
      return sourceReady;
    }

    // Feeds the SourceBuffer one operation at a time (it only accepts one
    // append/remove at once); re-entered from every `updateend`.
    function pump() {
      if (!sourceBuffer || sourceBuffer.updating || !mediaSource || mediaSource.readyState !== 'open') return;

      const buffered = video.buffered;
      if (buffered.length && video.currentTime - buffered.start(0) > KEEP_BEHIND_S * 2) {
        sourceBuffer.remove(0, video.currentTime - KEEP_BEHIND_S);
        return; // updateend → pump again
      }

      if (pending.length) {
        try {
          sourceBuffer.appendBuffer(pending[0]);
          pending.shift();
        } catch (e) {
          if (e.name === 'QuotaExceededError' && buffered.length && video.currentTime > 10) {
            sourceBuffer.remove(0, video.currentTime - 5); // make room, then retry this chunk on updateend
          } else {
            console.error('[HR-Watch] appendBuffer failed:', e);
            showError('Playback error: ' + e.message + ' — click Refresh to reconnect.');
            pending.shift();
          }
        }
        return;
      }

      if (ended) {
        try { mediaSource.endOfStream(); } catch (_) {}
        return;
      }
      followLiveEdge();
    }

    function followLiveEdge() {
      const buffered = video.buffered;
      if (!buffered.length) return;
      const liveEdge = buffered.end(buffered.length - 1);
      const lag = liveEdge - video.currentTime;
      if (!playbackStarted) {
        if (liveEdge < TARGET_LAG_S) return; // let a little media accumulate before starting
        video.currentTime = Math.max(buffered.start(0), liveEdge - TARGET_LAG_S);
        startPlayback();
      } else if (lag > MAX_LAG_S && !video.paused) {
        console.log(`[HR-Watch] ${lag.toFixed(1)}s behind live — jumping forward`);
        video.currentTime = liveEdge - TARGET_LAG_S;
      }
    }

    async function startPlayback() {
      playbackStarted = true;
      noVideoMsg.hidden = true;
      video.muted = false;
      try {
        await video.play();
      } catch (_) {
        // Autoplay with sound is blocked until the viewer interacts with the page.
        video.muted = true;
        try { await video.play(); } catch (_) {}
        soundBtn.hidden = false;
      }
      updateStatus('Live', 'live');
    }

    soundBtn.addEventListener('click', () => {
      video.muted = false;
      if (video.paused) video.play().catch(() => {});
      soundBtn.hidden = true;
    });
    // Any click counts as the gesture that lets the visualizer hear the audio.
    document.addEventListener('click', () => { if (playbackStarted) initAudioVisualizer(); });

    // ── Polling ─────────────────────────────────────────────────────────────
    function fatal(msg) {
      stopped = true;
      showError(msg);
      updateStatus('Error', 'disconnected');
    }

    function finish(msg) {
      if (ended) return;
      ended = true;
      stopped = true;
      clearInterval(timerInterval);
      updateStatus('Ended', 'disconnected');
      showNotice(msg + ' Everything received is still playable above.');
      if (!playbackStarted) noVideoMsg.textContent = 'No video was received for this interview.';
      pump();
    }

    async function poll() {
      if (stopped) return;
      let delay = POLL_MS;
      try {
        const url = `/api/stream/data?id=${encodeURIComponent(streamId)}&from=${offset}&viewer=${encodeURIComponent(viewerId)}`;
        const res = await fetch(url, { cache: 'no-store' });
        if (res.status === 401) return toLogin();
        if (res.status === 404 || res.status === 410) return finish('This interview has ended.');
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const live = res.headers.get('X-Stream-Live') !== '0';
        const more = res.headers.get('X-Stream-More') === '1';
        const next = parseInt(res.headers.get('X-Stream-Offset'), 10);

        if (res.status === 200) {
          try {
            await initMediaSource(res.headers.get('X-Stream-Mime') || '');
          } catch (e) {
            return fatal(e.message);
          }
          pending.push(await res.arrayBuffer());
          pump();
        }
        if (Number.isFinite(next)) offset = next;
        failures = 0;

        if (more) {
          delay = 0; // catching up after joining late — keep pulling
        } else if (!live) {
          return finish('The interview has ended.');
        } else if (!playbackStarted) {
          updateStatus('Buffering…', 'connecting');
        }
      } catch (e) {
        failures++;
        console.warn('[HR-Watch] poll failed:', e.message);
        updateStatus('Reconnecting…', 'connecting');
        delay = Math.min(POLL_MS * 2 ** failures, 10000);
      }
      setTimeout(poll, delay);
    }

    async function init() {
      if (!streamId) return fatal('Invalid or missing stream ID.');
      try {
        const res = await fetch(`/api/stream/info?id=${encodeURIComponent(streamId)}`, { cache: 'no-store' });
        if (res.status === 401) return toLogin();
        if (res.status === 404) {
          updateStatus('Not found', 'disconnected');
          showError('This stream no longer exists — the interview has probably ended. The dashboard lists the interviews running right now.');
          noVideoMsg.textContent = 'Stream not found';
          return;
        }
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const info = await res.json();
        candidateNameEl.textContent = info.candidateName || '—';
        subjectEl.textContent = info.subject || '—';
        startTimer(info.startTime);
        poll();
      } catch (e) {
        fatal('Could not reach the server (' + e.message + '). Click Refresh to try again.');
      }
    }

    video.addEventListener('ended', stopVisualizer);
    init();
  </script>
</body>
</html>
