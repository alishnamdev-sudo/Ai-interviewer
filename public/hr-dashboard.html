<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Dashboard - Live Interviews</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 30px 20px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    .header {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 12px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
    .btn-logout {
      background: none;
      border: 2px solid #ef4444;
      color: #ef4444;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-logout:hover {
      background: #ef4444;
      color: white;
    }
    .header h1 {
      font-size: 32px;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header p {
      color: #6b7280;
      font-size: 16px;
    }
    .stats {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px solid #e5e7eb;
    }
    .stat-box {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .stat-icon {
      font-size: 28px;
    }
    .stat-content h3 {
      font-size: 12px;
      color: #9ca3af;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #667eea;
    }
    .live-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      background: #10b981;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .streams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stream-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .stream-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
      border-color: #667eea;
    }
    .stream-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 15px;
    }
    .stream-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #10b981;
    }
    .stream-title h3 {
      font-size: 18px;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 5px;
      word-break: break-word;
    }
    .stream-subject {
      font-size: 14px;
      color: #667eea;
      font-weight: 500;
    }
    .stream-info {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 15px 0;
      padding: 15px;
      background: #f9fafb;
      border-radius: 8px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .info-label {
      color: #6b7280;
      font-weight: 500;
    }
    .info-value {
      color: #1f2937;
      font-weight: 600;
      font-family: 'Courier New', monospace;
    }
    .viewer-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #dbeafe;
      color: #1e40af;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .viewer-badge.active {
      background: #dcfce7;
      color: #166534;
    }
    .stream-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-watch {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-watch:hover {
      transform: scale(1.02);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    .btn-copy {
      background: #e5e7eb;
      color: #374151;
    }
    .btn-copy:hover {
      background: #d1d5db;
    }
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }
    .empty-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    .empty-title {
      font-size: 24px;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 10px;
    }
    .empty-text {
      color: #6b7280;
      font-size: 16px;
      margin-bottom: 30px;
    }
    .refresh-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 30px;
    }
    .refresh-btn {
      padding: 10px 20px;
      background: white;
      border: 2px solid #667eea;
      color: #667eea;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .refresh-btn:hover {
      background: #667eea;
      color: white;
    }
    .refresh-btn.loading {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .auto-refresh {
      font-size: 12px;
      color: #9ca3af;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: white;
      padding: 16px 20px;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      font-size: 14px;
      max-width: 300px;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { transform: translateX(400px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @media (max-width: 768px) {
      .header h1 {
        font-size: 24px;
      }
      .streams-grid {
        grid-template-columns: 1fr;
      }
      .stats {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div style="display: flex; justify-content: space-between; align-items: start;">
        <div>
          <h1>📹 HR Interview Dashboard</h1>
          <p>Monitor all live interviews in real-time</p>
        </div>
        <button id="logoutBtn" class="btn-logout" onclick="logout()" title="Logout">🚪</button>
      </div>
      <div class="stats">
        <div class="stat-box">
          <div class="stat-icon">🔴</div>
          <div class="stat-content">
            <h3>Live Streams</h3>
            <div class="stat-value" id="liveCount">0</div>
          </div>
        </div>
        <div class="stat-box">
          <div class="stat-icon">👥</div>
          <div class="stat-content">
            <h3>Active Viewers</h3>
            <div class="stat-value" id="viewerCount">0</div>
          </div>
        </div>
        <div class="stat-box">
          <div class="stat-icon">⏱️</div>
          <div class="stat-content">
            <h3>Last Updated</h3>
            <div class="stat-value" id="lastUpdate" style="font-size: 14px;">Just now</div>
          </div>
        </div>
      </div>
    </div>

    <div class="refresh-container">
      <button class="refresh-btn" id="refreshBtn" onclick="loadStreams()">🔄 Refresh Now</button>
      <div class="auto-refresh">
        <input type="checkbox" id="autoRefresh" checked>
        <label for="autoRefresh">Auto-refresh every 5 seconds</label>
      </div>
    </div>

    <div class="streams-grid" id="streamsGrid">
      <div class="empty-state">
        <div class="empty-icon">⏳</div>
        <div class="empty-title">Loading streams...</div>
      </div>
    </div>
  </div>

  <script>
    const streamsGrid = document.getElementById('streamsGrid');
    const liveCountEl = document.getElementById('liveCount');
    const viewerCountEl = document.getElementById('viewerCount');
    const lastUpdateEl = document.getElementById('lastUpdate');
    const refreshBtn = document.getElementById('refreshBtn');
    const autoRefreshCheckbox = document.getElementById('autoRefresh');

    let autoRefreshInterval = null;

    async function loadStreams() {
      try {
        refreshBtn.classList.add('loading');
        refreshBtn.disabled = true;

        const response = await fetch('/api/streams/active');
        if (!response.ok) throw new Error('Failed to load streams');

        const data = await response.json();
        renderStreams(data.streams);

        // Update stats
        liveCountEl.textContent = data.count;
        const totalViewers = data.streams.reduce((sum, s) => sum + s.viewerCount, 0);
        viewerCountEl.textContent = totalViewers;

        // Update last updated time
        const now = new Date();
        lastUpdateEl.textContent = now.toLocaleTimeString();

        showToast(`Updated: ${data.count} live stream${data.count !== 1 ? 's' : ''}`);
      } catch (error) {
        console.error('Error loading streams:', error);
        streamsGrid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="empty-icon">⚠️</div>
            <div class="empty-title">Error Loading Streams</div>
            <div class="empty-text">${error.message}</div>
          </div>
        `;
      } finally {
        refreshBtn.classList.remove('loading');
        refreshBtn.disabled = false;
      }
    }

    function renderStreams(streams) {
      if (streams.length === 0) {
        streamsGrid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="empty-icon">😴</div>
            <div class="empty-title">No Active Interviews</div>
            <div class="empty-text">No candidates are currently taking interviews. Check back later!</div>
          </div>
        `;
        return;
      }

      streamsGrid.innerHTML = streams.map(stream => `
        <div class="stream-card">
          <div class="stream-header">
            <div class="stream-title">
              <h3>${escapeHtml(stream.candidateName)}</h3>
              <div class="stream-subject">${escapeHtml(stream.subject)}</div>
            </div>
            <div class="stream-status">
              <span class="live-indicator"></span>LIVE
            </div>
          </div>

          <div class="stream-info">
            <div class="info-row">
              <span class="info-label">Duration</span>
              <span class="info-value">${formatDuration(stream.duration)}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Viewers</span>
              <span class="viewer-badge ${stream.viewerCount > 0 ? 'active' : ''}">
                👁️ ${stream.viewerCount} watching
              </span>
            </div>
            <div class="info-row">
              <span class="info-label">Stream ID</span>
              <span class="info-value" style="font-size: 11px; word-break: break-all;">${stream.streamId}</span>
            </div>
          </div>

          <div class="stream-actions">
            <button class="btn btn-watch" onclick="openStream('${stream.streamId}')">
              👁️ Watch Live
            </button>
            <button class="btn btn-copy" onclick="copyLink('${stream.streamId}')">
              📋 Copy Link
            </button>
          </div>
        </div>
      `).join('');
    }

    function formatDuration(seconds) {
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;

      if (hours > 0) {
        return `${hours}h ${minutes}m`;
      }
      return `${minutes}m ${secs}s`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function openStream(streamId) {
      window.open(`/hr-watch/${streamId}`, '_blank');
    }

    function copyLink(streamId) {
      const url = `${window.location.origin}/hr-watch/${streamId}`;
      navigator.clipboard.writeText(url).then(() => {
        showToast('✓ Link copied to clipboard!');
      }).catch(() => {
        showToast('⚠️ Could not copy link');
      });
    }

    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function setupAutoRefresh() {
      if (autoRefreshCheckbox.checked) {
        if (autoRefreshInterval) clearInterval(autoRefreshInterval);
        autoRefreshInterval = setInterval(loadStreams, 5000);
      } else {
        if (autoRefreshInterval) clearInterval(autoRefreshInterval);
      }
    }

    autoRefreshCheckbox.addEventListener('change', setupAutoRefresh);

    // Authentication check
    async function checkAuth() {
      try {
        const res = await fetch('/api/hr/session');
        if (res.status === 401 || !res.ok) {
          window.location.href = '/hr-login';
          return false;
        }
        const data = await res.json();
        if (!data.isHR) {
          window.location.href = '/hr-login';
          return false;
        }
        return true;
      } catch (e) {
        console.error('Auth check failed:', e);
        return false;
      }
    }

    async function logout() {
      if (confirm('Logout from HR Dashboard?')) {
        try {
          await fetch('/api/hr/logout', { method: 'POST' });
          window.location.href = '/hr-login';
        } catch (e) {
          console.error('Logout error:', e);
          window.location.href = '/hr-login';
        }
      }
    }

    // Check authentication before loading
    checkAuth().then(isAuth => {
      if (isAuth) {
        loadStreams();
        setupAutoRefresh();
      }
    });
  </script>
</body>
</html>
